services:
  - type: web
    name: instagram-scraper-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_WORKERS
        value: "2"
